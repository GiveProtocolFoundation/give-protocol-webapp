name: Auth Confirm Seam — Scheduled E2E + Signup Smoke

# GIV-921 + GIV-931: This workflow proves the full signup → email link → confirm →
# sign-in chain end-to-end, plus a fast HTTP-level signup smoke test that catches
# hook-configuration outages (GIV-931) before they become hour-long production blockers.

permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"

  pull_request:
    paths:
      - "src/pages/Auth*.tsx"
      - "src/pages/Register.tsx"
      - "src/routes/index.tsx"
      - "supabase/functions/send-email-hook/**"
      - "cypress/e2e/auth-confirm-seam.cy.ts"
      - "cypress/e2e/auth-signup-smoke.cy.ts"
      - "cypress/support/supabase-auth.ts"
      - ".github/workflows/auth-confirm-seam.yml"

  workflow_dispatch:

jobs:
  auth-confirm-seam:
    name: Auth confirm seam E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # These are read by Cypress as CYPRESS_* env vars automatically.
      CYPRESS_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
      CYPRESS_SUPABASE_ANON_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}
      CYPRESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CYPRESS_SUPABASE_SERVICE_ROLE_KEY }}
      # App env so the Vite dev server starts correctly.
      VITE_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}

    steps:
      - name: Verify required secrets are configured
        run: |
          missing=0
          for v in CYPRESS_SUPABASE_URL CYPRESS_SUPABASE_ANON_KEY CYPRESS_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing
        env:
          CYPRESS_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
          CYPRESS_SUPABASE_ANON_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}
          CYPRESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CYPRESS_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build the app (SPA mode for Cypress)
        run: npm run build:spa
        env:
          VITE_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}

      # Serve the built SPA on port 5173 so Cypress baseUrl resolves.
      - name: Start preview server
        run: npx vite preview --port 5173 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:5173 > /dev/null && echo "Server ready" && break
            echo "Waiting for server... attempt $i"
            sleep 1
          done

      - name: Run auth confirm seam spec
        run: npx cypress run --spec "cypress/e2e/auth-confirm-seam.cy.ts" --browser chrome --headless
        env:
          # Cypress reads CYPRESS_* prefix automatically.
          CYPRESS_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
          CYPRESS_SUPABASE_ANON_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}
          CYPRESS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CYPRESS_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ github.run_id }}
          path: cypress/screenshots/
          if-no-files-found: ignore

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ github.run_id }}
          path: cypress/videos/
          if-no-files-found: ignore

      # On scheduled runs, create a GitHub issue if the run fails.
      # This ensures failures in off-PR runs are not silently swallowed.
      - name: Create failure issue on scheduled run
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO] Auth confirm seam E2E failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Auth confirm seam check failed',
                '',
                'The scheduled GIV-921 E2E run detected a broken link in the auth chain.',
                '',
                `**Run:** ${runUrl}`,
                '',
                '### What to check',
                '- `/auth/confirm` route exists in `src/routes/index.tsx`',
                '- `send-email-hook` builds URLs pointing at `/auth/confirm`',
                '- `AuthCallback` correctly exchanges `token_hash` via `verifyOtp`',
                '- Supabase project URL / anon key / service-role key are still valid',
                '',
                'This issue was opened automatically by the `auth-confirm-seam` workflow.',
              ].join('\n'),
              labels: ['bug', 'auth', 'e2e'],

  # ------------------------------------------------------------------
  # GIV-931: Fast HTTP-level signup smoke test (no browser, no build).
  # Would have caught the 7-hour password-signup outage caused by
  # send-email-hook crashing with missing SEND_EMAIL_HOOK_SECRET.
  # ------------------------------------------------------------------
  auth-signup-smoke:
    name: Auth signup smoke (password path)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CYPRESS_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
      CYPRESS_SUPABASE_ANON_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run signup smoke spec
        run: npx cypress run --spec "cypress/e2e/auth-signup-smoke.cy.ts" --headless --browser chrome
        env:
          CYPRESS_SUPABASE_URL: ${{ secrets.CYPRESS_SUPABASE_URL }}
          CYPRESS_SUPABASE_ANON_KEY: ${{ secrets.CYPRESS_SUPABASE_ANON_KEY }}

      - name: Create failure issue on scheduled run
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AUTO] Auth signup smoke test failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                '## Auth signup smoke test failed',
                '',
                'The scheduled GIV-931 smoke test detected that password-based signups are failing.',
                'This typically indicates a send-email-hook configuration problem (missing or',
                'mis-named secrets).',
                '',
                `**Run:** ${runUrl}`,
                '',
                '### What to check',
                '- `supabase secrets list --project-ref lhbyfidtlhojnrewpstp` — is `SEND_EMAIL_HOOK_SECRET` set?',
                '- `supabase secrets list --project-ref lhbyfidtlhojnrewpstp` — is `RESEND_API_KEY` set (no typo)?',
                '- Verify the hook secret matches `hook_send_email_secrets` in the Supabase Auth config',
                '- Check Resend dashboard for API key validity / rate limits',
                '',
                'This issue was opened automatically by the `auth-confirm-seam` workflow.',
              ].join('\n'),
              labels: ['bug', 'auth', 'critical'],
            });
            });
