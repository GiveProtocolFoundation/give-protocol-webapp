name: Scheduled Schema Drift Check

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-schema-drift:
    name: Check Schema Drift (prod)
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: lhbyfidtlhojnrewpstp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Extract Expected Tables from Migrations
        id: expected
        run: |
          node scripts/ci/extract-tables.mjs --dir supabase/migrations > expected_tables.txt

      - name: Dump Actual Schema from Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "Dumping schema for project ${{ env.PROJECT_ID }}..."
          supabase db dump --linked --schema public --project-ref ${{ env.PROJECT_ID }} > db_dump.sql
          node scripts/ci/extract-tables.mjs --file db_dump.sql > actual_tables.txt

      - name: Detect Drift (Diff Expected vs Actual)
        run: |
          echo "Comparing expected tables (from migrations) against actual tables (from db dump)..."
          diff -u expected_tables.txt actual_tables.txt

      # The dump is schema-only (no data) and is what reconciliation work
      # (GIV-972 and later) needs: without it, a red run shows only the table
      # name diff, not the DDL behind it. Keep the artifact short-lived.
      - name: Upload schema dump artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-dump-${{ github.run_id }}
          retention-days: 7
          path: |
            db_dump.sql
            expected_tables.txt
            actual_tables.txt
