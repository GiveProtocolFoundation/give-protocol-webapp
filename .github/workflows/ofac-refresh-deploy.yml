name: OFAC SDN cache deploy & seed

# Brings up and seeds the OFAC SDN screening cache for GIV-1075 (operational
# wiring for GIV-1048):
#   1. Deploys the ofac-refresh Edge Function.
#   2. Applies pending migrations (creates ofac_sdn_entries + registers the
#      daily pg_cron job that calls ofac-refresh).
#   3. Seeds the cache once via public.invoke_ofac_refresh() so the screening
#      service stops returning status `unavailable`.
#   4. Verifies ofac_sdn_entries is non-empty.
#
# Manual dispatch only, gated behind the `production` GitHub Environment so a
# reviewer approves each run (same governance as database-deploy.yml). Defaults
# to a dry run — no writes happen unless you uncheck it.
#
# Connectivity: uses the Supabase Management API (--linked) with the repo-level
# SUPABASE_ACCESS_TOKEN secret, because the direct connection host is IPv6-only
# and unreachable from GitHub-hosted runners (see database-deploy.yml).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - production
        default: production
      dry_run:
        description: "Dry run — report what would change without writing"
        type: boolean
        required: true
        default: true
      apply_migrations:
        description: "Apply pending migrations (supabase db push)"
        type: boolean
        required: true
        default: true
      deploy_function:
        description: "Deploy the ofac-refresh edge function"
        type: boolean
        required: true
        default: true
      seed:
        description: "Seed the SDN cache via invoke_ofac_refresh()"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: ofac-refresh-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "ofac-refresh → ${{ inputs.environment }}${{ inputs.dry_run && ' (dry run)' || '' }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve target project
        id: target
        run: |
          case "${{ inputs.environment }}" in
            production)
              echo "ref=lhbyfidtlhojnrewpstp" >> "$GITHUB_OUTPUT"
              echo "Target project: lhbyfidtlhojnrewpstp (production)"
              ;;
            *)
              echo "::error::No Supabase project mapped for environment '${{ inputs.environment }}'."
              exit 1
              ;;
          esac

      - name: Verify access token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set as a repository secret."
            exit 1
          fi
          echo "Access token is present."

      - name: Record run parameters
        run: |
          {
            echo "## OFAC SDN cache deploy & seed — ${{ inputs.environment }}"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Mode | ${{ inputs.dry_run && '**dry run** (no writes)' || '**APPLY** (writes to production)' }} |"
            echo "| Project | \`${{ steps.target.outputs.ref }}\` |"
            echo "| Deploy function | \`${{ inputs.deploy_function }}\` |"
            echo "| Apply migrations | \`${{ inputs.apply_migrations }}\` |"
            echo "| Seed | \`${{ inputs.seed }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy ofac-refresh function
        if: ${{ !inputs.dry_run && inputs.deploy_function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -o pipefail
          supabase functions deploy ofac-refresh --project-ref "$PROJECT_REF" 2>&1 \
            | tee function-deploy.txt
          {
            echo
            echo "### Function deploy"
            echo '```'
            tail -30 function-deploy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show migration plan (dry run)
        if: ${{ inputs.dry_run && inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -o pipefail
          supabase db push --linked --project-ref "$PROJECT_REF" --dry-run 2>&1 \
            | tee push-plan.txt
          {
            echo
            echo "### Migrations that would be applied"
            echo '```'
            tail -40 push-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: ${{ !inputs.dry_run && inputs.apply_migrations }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -o pipefail
          supabase db push --linked --project-ref "$PROJECT_REF" 2>&1 | tee apply-output.txt
          {
            echo
            echo "### Applied migrations"
            echo '```'
            tail -40 apply-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Seed SDN cache
        if: ${{ !inputs.dry_run && inputs.seed }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -o pipefail
          supabase db query --linked --project-ref "$PROJECT_REF" \
            "SELECT public.invoke_ofac_refresh();" 2>&1 | tee seed-output.txt
          {
            echo
            echo "### Seed"
            echo '```'
            cat seed-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify ofac_sdn_entries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -o pipefail
          supabase db query --linked --project-ref "$PROJECT_REF" "
            SELECT (SELECT to_regclass('public.ofac_sdn_entries') IS NOT NULL) AS table_present,
                   (SELECT count(*) FROM public.ofac_sdn_entries) AS sdn_rows,
                   (SELECT count(*) FROM cron.job WHERE jobname = 'ofac-refresh-daily') AS cron_registered;
          " 2>&1 | tee verify-output.txt
          {
            echo
            echo "### Verification"
            echo '```'
            cat verify-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: inputs.dry_run
        run: |
          echo "Dry run complete — nothing was written."
          {
            echo
            echo "> [!NOTE]"
            echo "> Dry run: no changes were made. Re-run with **dry_run unchecked** to apply."
          } >> "$GITHUB_STEP_SUMMARY"