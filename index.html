<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/give_logo_gradient.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CANONICAL CSP — this meta tag is the single source-of-truth.
      All other CSP locations (nginx.conf, vercel.json, security/index.ts) must mirror this.
      CI validates consistency via scripts/validate-csp.mjs.
      Supabase URL is intentionally public — security via RLS policies and anon key.

      NOTE: CSP meta tags do not support report-uri/report-to directives.
      Violation reporting is handled by the server-sent Content-Security-Policy
      HTTP header (vercel.json, nginx.conf, .htaccess) which includes report-to
      and report-uri pointing to /api/csp-report. See GIV-328.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-rum+BkA883k4o7T5Fk/eJ/2bXkW23qG+uAmv8xJCpSI=' https://www.googletagmanager.com https://www.google-analytics.com https://secure.helcim.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co https://*.sentry.io wss://*.supabase.co https://api.giveprotocol.io https://www.google-analytics.com https://analytics.google.com https://api.coingecko.com https://secure.helcim.app https://api.helcim.com https://www.paypal.com https://api-m.paypal.com https://api-m.sandbox.paypal.com https://mainnet.base.org https://base.publicnode.com https://mainnet.optimism.io https://sepolia.base.org https://sepolia.optimism.io https://rpc.ankr.com https://eth.drpc.org https://arb1.arbitrum.io https://polygon-bor-rpc.publicnode.com https://api.avax.network https://s3.amazonaws.com; frame-src 'self' https://secure.helcim.app https://www.paypal.com https://www.sandbox.paypal.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- Google Analytics consent defaults (denied until user accepts via React banner) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // All consent categories denied by default — GDPR Art. 4(11).
      // The React ConsentProvider bridges stored consent into gtag on mount.
      // The useGA4Loader hook loads gtag.js only after analytics consent is granted.
      gtag("consent", "default", {
        analytics_storage: "denied",
        wait_for_update: 500,
      });
    </script>

    <title>Give Protocol - Smart Giving Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
